<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anonymous Tales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Full-page container */
        body {
            background-image: url('img/cover_image.jpg');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        /* Layout container */
        .layout-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
        }

        /* Container for the form */
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .login-container h2 {
            color: #2a9d8f;
            margin-bottom: 25px;
        }

        /* Form styling */
        .form-floating {
            margin-bottom: 20px;
        }

        .form-control:focus {
            border-color: #2a9d8f;
            box-shadow: 0 0 0 0.2rem rgba(42, 157, 143, 0.25);
        }

        /* Button styling */
        .btn-primary {
            background-color: #2a9d8f;
            border-color: #2a9d8f;
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
        }

        .btn-primary:hover {
            background-color: #21867a;
            border-color: #21867a;
        }

        .btn-primary:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
            cursor: not-allowed;
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Alert styles */
        .alert {
            display: none;
            margin-bottom: 20px;
        }

        .alert.show {
            display: block;
        }

        /* Typing text container */
        .typing-container {
            max-width: 500px;
            font-family: 'Courier', monospace;
            color: white;
            text-align: left;
        }

        /* Typing effect */
        .typing-text {
            font-size: 1.5rem;
            border-right: 2px solid white;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Blinking cursor animation */
        @keyframes blink-cursor {
            from { border-right-color: white; }
            to { border-right-color: transparent; }
        }

        .typing-text {
            animation: blink-cursor 0.7s steps(44) infinite;
        }

        /* Adjust heading fonts */
        .typing-heading {
            font-size: 2rem;
        }

        .typing-subheading {
            font-size: 1.25rem;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #2a9d8f;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .layout-container {
                flex-direction: column;
                align-items: center;
                padding: 0;
            }
            
            .typing-container {
                display: none;
            }
            
            .login-container {
                margin: 0 10px;
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="layout-container">
        <!-- Typing Animation Section -->
        <div class="typing-container d-none d-md-block">
            <h1 class="typing-heading typing-text"></h1>
            <p class="typing-subheading"></p>
        </div>

        <!-- Login Form -->
        <div class="login-container">
            <h2 class="text-center">Welcome Back</h2>
            
            <!-- Alert Messages -->
            <div id="alertSuccess" class="alert alert-success" role="alert"></div>
            <div id="alertError" class="alert alert-danger" role="alert"></div>
            
            <form id="loginForm" novalidate>
                <div class="form-floating">
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <label for="email">Email address</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <label for="password">Password</label>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn">
                    <span class="spinner" id="loginSpinner"></span>
                    <span id="loginBtnText">Sign In</span>
                </button>
            </form>

            <div class="signup-link">
                <p>Don't have an account? <a href="index.html">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ============================================
        // Typing Animation
        // ============================================
        const mainHeading = "Welcome to Anonymous Tales";
        const subHeading = "Share your story. Stay anonymous. Connect with others.";
        const typingSpeed = 100;

        function typeText(element, text, callback) {
            let i = 0;
            element.innerHTML = '';
            function typing() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, typingSpeed);
                } else if (callback) {
                    callback();
                }
            }
            typing();
        }

        document.addEventListener('DOMContentLoaded', function() {
            typeText(document.querySelector('.typing-heading'), mainHeading, function() {
                setTimeout(function() {
                    typeText(document.querySelector('.typing-subheading'), subHeading);
                }, 500);
            });

            // Check for stored credentials
            const storedEmail = localStorage.getItem('rememberedEmail');
            if (storedEmail) {
                document.getElementById('email').value = storedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });

        // ============================================
        // Alert Functions
        // ============================================
        function showAlert(type, message) {
            const alertId = type === 'success' ? 'alertSuccess' : 'alertError';
            const alertEl = document.getElementById(alertId);
            alertEl.textContent = message;
            alertEl.classList.add('show');
            
            setTimeout(() => {
                alertEl.classList.remove('show');
            }, 5000);
        }

        function hideAlerts() {
            document.getElementById('alertSuccess').classList.remove('show');
            document.getElementById('alertError').classList.remove('show');
        }

        // ============================================
        // Button State Management
        // ============================================
        function setButtonLoading(buttonId, spinnerId, textId, loadingText) {
            const btn = document.getElementById(buttonId);
            const spinner = document.getElementById(spinnerId);
            const text = document.getElementById(textId);
            
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            text.textContent = loadingText;
        }

        function setButtonReady(buttonId, spinnerId, textId, readyText) {
            const btn = document.getElementById(buttonId);
            const spinner = document.getElementById(spinnerId);
            const text = document.getElementById(textId);
            
            btn.disabled = false;
            spinner.style.display = 'none';
            text.textContent = readyText;
        }

        // ============================================
        // Login Form Submission
        // ============================================
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            hideAlerts();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Basic validation
            if (!email || !password) {
                showAlert('error', 'Please enter both email and password');
                return;
            }

            // Disable button and show loading
            setButtonLoading('loginBtn', 'loginSpinner', 'loginBtnText', 'Signing In...');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Store token
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // Handle remember me
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    showAlert('success', 'Login successful! Redirecting...');
                    
                    // Redirect after a short delay
                    setTimeout(() => {
                        window.location.href = 'homepage.html';
                    }, 1000);
                } else {
                    showAlert('error', data.message || 'Invalid email or password');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('error', 'Network error. Please check your connection and try again.');
            } finally {
                setButtonReady('loginBtn', 'loginSpinner', 'loginBtnText', 'Sign In');
            }
        });
    </script>
</body>
</html>
